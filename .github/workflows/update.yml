# Hourly CNN Fear & Greed updater
name: Update CNN Fear & Greed

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fetch.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: cnn-fear-greed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch CNN official data
        run: python fetch.py

      - name: Commit latest data
        run: |
          if git diff --quiet -- latest.json; then
            echo "latest.json is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update CNN Fear & Greed data"
          git push
